<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc" aria-label="The Daikenja loop in four steps. Read: you paste a thread and Daikenja asks what only you know. Draft: it writes the reply and can challenge it before you send. Record: it proposes ledger entries and waits for your yes, and writes them to DECISIONS.md and open.md in the project's git repository. Come back: weeks later you type a command and it tells you what changed.">
  <title id="title">How Daikenja works</title>
  <desc id="desc">The Daikenja loop in four steps. Read: you paste a thread and Daikenja asks what only you know. Draft: it writes the reply and can challenge it before you send. Record: it proposes ledger entries and waits for your yes, and writes them to DECISIONS.md and open.md in the project's git repository. Come back: weeks later you type a command and it tells you what changed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1F2937; }
    .step { font-size: 22px; font-weight: 700; }
    .num { font-size: 14px; font-weight: 700; fill: #6B7280; letter-spacing: 1px; }
    .lane { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #374151; }
    .body { font-size: 15px; }
    .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 14px; font-weight: 600; }
    .note { font-size: 15px; font-style: italic; fill: #374151; }
  </style>

  <rect x="0" y="0" width="1200" height="600" rx="18" fill="#FAFAF7" stroke="#D1D5DB" stroke-width="2"/>

  <!-- lane bands -->
  <rect x="20" y="96" width="1160" height="120" rx="12" fill="#E3EDFB"/>
  <rect x="20" y="228" width="1160" height="140" rx="12" fill="#ECE6F7"/>
  <rect x="20" y="380" width="1160" height="140" rx="12" fill="#E2F2E7"/>

  <text class="lane" x="38" y="150">YOU</text>
  <text class="lane" x="38" y="168">SAY</text>
  <text class="lane" x="38" y="290">DAIKENJA</text>
  <text class="lane" x="38" y="308">DOES</text>
  <text class="lane" x="38" y="442">YOU</text>
  <text class="lane" x="38" y="460">GET</text>

  <!-- column headers -->
  <text class="num" x="180" y="44">STEP 1</text>
  <text class="step" x="180" y="74">Read</text>
  <text class="num" x="435" y="44">STEP 2</text>
  <text class="step" x="435" y="74">Draft</text>
  <text class="num" x="690" y="44">STEP 3</text>
  <text class="step" x="690" y="74">Record</text>
  <text class="num" x="945" y="44">LATER</text>
  <text class="step" x="945" y="74">Come back</text>

  <!-- cards: YOU SAY -->
  <g>
    <rect x="170" y="108" width="225" height="96" rx="10" fill="#FFFFFF" stroke="#93B4E8" stroke-width="1.5"/>
    <text class="body" x="184" y="136">"Help me answer this."</text>
    <text class="body" x="184" y="160">You paste the</text>
    <text class="body" x="184" y="182">thread text.</text>

    <rect x="425" y="108" width="225" height="96" rx="10" fill="#FFFFFF" stroke="#93B4E8" stroke-width="1.5"/>
    <text class="body" x="439" y="136">Where you stand: what</text>
    <text class="body" x="439" y="160">you already promised,</text>
    <text class="body" x="439" y="182">what you will not commit to.</text>

    <rect x="680" y="108" width="225" height="96" rx="10" fill="#FFFFFF" stroke="#93B4E8" stroke-width="1.5"/>
    <text class="body" x="694" y="136">"Log this."</text>
    <text class="body" x="694" y="160">The thread settled</text>
    <text class="body" x="694" y="182">two things.</text>

    <rect x="935" y="108" width="225" height="96" rx="10" fill="#FFFFFF" stroke="#93B4E8" stroke-width="1.5"/>
    <text class="body" x="949" y="136">Three weeks later,</text>
    <text class="body" x="949" y="160">you type the command.</text>
  </g>

  <!-- cards: DAIKENJA DOES -->
  <g>
    <rect x="170" y="240" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#A895D6" stroke-width="1.5"/>
    <text class="code" x="184" y="266">/daikenja:thread</text>
    <text class="body" x="184" y="290">Says what is asked and</text>
    <text class="body" x="184" y="312">by whom, then asks what</text>
    <text class="body" x="184" y="334">only you know.</text>

    <rect x="425" y="240" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#A895D6" stroke-width="1.5"/>
    <text class="code" x="439" y="266">/daikenja:compose</text>
    <text class="body" x="439" y="288">writes it in your words.</text>
    <text class="code" x="439" y="314">/daikenja:preflight</text>
    <text class="body" x="439" y="336">optionally challenges it.</text>

    <rect x="680" y="240" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#A895D6" stroke-width="1.5"/>
    <text class="code" x="694" y="266">/daikenja:project-log</text>
    <text class="body" x="694" y="290">Shows the exact lines</text>
    <text class="body" x="694" y="312">it wants to write, then</text>
    <text class="body" x="694" y="334">waits for your yes.</text>

    <rect x="935" y="240" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#A895D6" stroke-width="1.5"/>
    <text class="code" x="947" y="266" style="font-size:13px">/daikenja:project-catchup</text>
    <text class="body" x="949" y="290">Reads git history since</text>
    <text class="body" x="949" y="312">the commit you last saw.</text>
  </g>

  <!-- cards: YOU GET -->
  <g>
    <rect x="170" y="392" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#86C49A" stroke-width="1.5"/>
    <text class="body" x="184" y="420">A summary of the ask.</text>
    <text class="body" x="184" y="444">No draft yet -- on</text>
    <text class="body" x="184" y="466">purpose.</text>

    <rect x="425" y="392" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#86C49A" stroke-width="1.5"/>
    <text class="body" x="439" y="420">A draft you copy out</text>
    <text class="body" x="439" y="444">and send yourself.</text>

    <rect x="680" y="392" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#86C49A" stroke-width="1.5"/>
    <text class="body" x="694" y="420">Entries in the project's</text>
    <text class="body" x="694" y="444">ledger, in its repository:</text>
    <text class="code" x="694" y="470">DECISIONS.md</text>
    <text class="code" x="694" y="494">.daikenja/open.md</text>

    <rect x="935" y="392" width="225" height="116" rx="10" fill="#FFFFFF" stroke="#86C49A" stroke-width="1.5"/>
    <text class="body" x="949" y="420">What was decided or</text>
    <text class="body" x="949" y="444">opened while you were</text>
    <text class="body" x="949" y="466">away, and who owns it.</text>
  </g>

  <!-- flow arrows between steps, in the DOES lane -->
  <line x1="397" y1="298" x2="421" y2="298" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="652" y1="298" x2="676" y2="298" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="907" y1="298" x2="931" y2="298" stroke="#4B5563" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text class="note" x="600" y="562" text-anchor="middle">Nothing is sent or posted for you. Ledger entries are written only on your yes, and you commit them.</text>
</svg>
